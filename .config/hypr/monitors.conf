# Monitor Configuration
# See Hyprland wiki for more details
# https://wiki.hyprland.org/Configuring/Monitors/
# Configure your Display resolution, offset, scale and Monitors here, use `hyprctl monitors` to get the info.


monitorv2 {
  output = DP-5
  mode = 1920x1080@240
  position = 0x0
  scale = 1
}

monitorv2 {
  output = DP-6
  mode = 2560x1440@240
  position = 1920x0
  scale = 1
  bitdepth = 10
  cm = wide
  # min_luminance = 1
  # sdrbrightness = 1.3
  # sdrsaturation = 1.2
  # supports_wide_color = 1
  # supports_hdr = 1
  # use_fp16 = 0
  icc = /home/master/Downloads/MAG-271QPX-E2.icm
}

windowrule = match:class flameshot, monitor 0

windowrule {
  name = flameshot
  float = on
  pin = on
  no_anim = on
  stay_focused = on
  border_size = 0
  move = 0 0
  size = 4480 1440
  match:class = ^(flameshot)$
}


bind = SUPER, A, exec, hyprland-switch-monitors switch 0

bind = SUPER, S, exec, hyprland-switch-monitors switch 1

bind = SUPER, D, exec, hyprland-switch-monitors switch 2

bind = SUPER, F, exec, hyprland-switch-monitors switch 3

bind = SUPER, G, exec, hyprland-switch-monitors switch 4

bind = SUPER, H, exec, hyprland-switch-monitors switch 5

bind = SUPER, J, exec, hyprland-switch-monitors switch 6

bind = SUPER, K, exec, hyprland-switch-monitors switch 7

bind = SUPER, L, exec, hyprland-switch-monitors switch 8

bind = SUPER, SEMICOLON, exec, hyprland-switch-monitors switch 9

# Move active window to a workspace with mainMod + SHIFT + [0-9]

bind = SUPER SHIFT, A, exec, hyprland-switch-monitors move 0

bind = SUPER SHIFT, S, exec, hyprland-switch-monitors move 1

bind = SUPER SHIFT, D, exec, hyprland-switch-monitors move 2

bind = SUPER SHIFT, F, exec, hyprland-switch-monitors move 3

bind = SUPER SHIFT, G, exec, hyprland-switch-monitors move 4

bind = SUPER SHIFT, H, exec, hyprland-switch-monitors move 5

bind = SUPER SHIFT, J, exec, hyprland-switch-monitors move 6

bind = SUPER SHIFT, K, exec, hyprland-switch-monitors move 7

bind = SUPER SHIFT, L, exec, hyprland-switch-monitors move 8

bind = SUPER SHIFT, SEMICOLON, exec, hyprland-switch-monitors move 9


